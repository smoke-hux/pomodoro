name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so this is the type
      # check as well as the bundle.
      - name: Type check and build
        run: npm run build

      - name: Test
        run: npm test

  rust:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system WebKit and GTK stack even for a plain
      # `cargo test`, because the build script compiles the app's context.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri.conf.json points at ../dist, and the build script fails without
      # it, so the frontend is built before anything touches cargo.
      - run: npm ci
      - run: npm run build

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The live D-Bus test is #[ignore]d: a CI runner has no session bus or
      # notification daemon.
      - name: Test
        working-directory: src-tauri
        run: cargo test
