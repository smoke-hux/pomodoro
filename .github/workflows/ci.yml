name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      # `npm run build` is `tsc --noEmit && vite build`, so this is the type
      # check as well as the bundle.
      - name: Type check and build
        run: npm run build

      - name: Test
        run: npm test

  rust:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Tauri links against the system WebKit and GTK stack even for a plain
      # `cargo test`, because the build script compiles the app's context.
      - name: Install Tauri system dependencies
        run: bash scripts/setup-linux.sh --install

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # tauri.conf.json points at ../dist, and the build script fails without
      # it, so the frontend is built before anything touches cargo.
      - run: npm ci
      - run: npm run build

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # The live D-Bus test is #[ignore]d: a CI runner has no session bus or
      # notification daemon.
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  desktop:
    name: Desktop smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install desktop and WebDriver dependencies
        run: bash scripts/setup-linux.sh --install --desktop
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}
      - run: npm ci
      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --locked --version 2.0.6
      - name: Build desktop application
        run: npm run tauri -- build --debug --no-bundle
      - name: Exercise the desktop app with an isolated data directory and session bus
        env:
          POMODORO_TEST_ARTIFACTS: test-artifacts/desktop
          # This job uses Xvfb; native Wayland is covered in the release checklist.
          GDK_BACKEND: x11
        run: xvfb-run -a npm run test:desktop
      - name: Save desktop screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-smoke-screenshots-${{ matrix.os }}
          path: test-artifacts/desktop
          if-no-files-found: ignore
          retention-days: 7
