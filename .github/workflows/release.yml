name: Release

# Publishes the apt repository at https://smoke-hux.github.io/pomodoro.
#
# Tagging a version (v0.1.0) builds the .deb, attaches it to a GitHub
# release, and rebuilds the repository from every .deb of every release so
# far, so that an upgrade never removes the version it replaces. The
# workflow can also be run by hand to republish the current releases
# without cutting a new one.
#
# Needs two repository secrets: APT_SIGNING_KEY, an armoured secret GPG key,
# and APT_SIGNING_PASSPHRASE, its passphrase (empty if it has none). Pages
# must be set to deploy from GitHub Actions, and the github-pages
# environment must allow tags to deploy: it is created restricted to the
# default branch, which would fail every tagged release on its last step.
# Settings -> Environments -> github-pages -> Deployment branches and tags
# needs a rule for `v*`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Writing to contents belongs to the one job that creates a release, not to
# the job holding the signing key.
permissions:
  contents: read

# Per ref, because a group shared by every tag drops a queued run: pushing
# three tags together would leave the middle one cancelled, with no package
# and no release. Publishes are serialised on their own job instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build package
    # A manual run republishes packages that already exist, so only a tag
    # push spends a compile. Keyed on the event, not the ref: a manual run
    # can be launched from a tag, and building that tag again would fail on
    # the release that already exists.
    if: github.event_name == 'push'
    # The oldest release still supported: glibc and WebKit symbols resolve
    # forwards, so a package built here also installs on 24.04 and newer.
    # GitHub began deprecating this image on 2026-09-17 and removes it on
    # 2027-04-17, with brownouts before then; a brownout fails this job
    # loudly and stops the publish rather than republishing silently. When
    # it goes, either build in a `container: ubuntu:22.04` on a supported
    # runner, which pins the build glibc independently of the image, or move
    # to ubuntu-24.04 and drop the 22.04 claim from the README and the
    # repository's own page.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The tag is the single source of the version: a tag that disagrees
      # with the manifests would publish a package users cannot upgrade to.
      - name: Check the tag against the manifests
        run: |
          tag=${GITHUB_REF_NAME#v}
          for file in package.json src-tauri/tauri.conf.json; do
            version=$(node -p "require('./$file').version")
            [ "$version" = "$tag" ] || {
              echo "::error::$file is version $version but the tag is $tag"
              exit 1
            }
          done
          # Not the version the package carries — Tauri takes that from
          # tauri.conf.json — but the one compiled into the binary.
          version=$(sed -n '0,/^version = /s/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml)
          [ "$version" = "$tag" ] || {
            echo "::error::src-tauri/Cargo.toml is version $version but the tag is $tag"
            exit 1
          }

      - name: Build the Debian package
        run: npm run tauri build -- --bundles deb

      # Tauri names the file after the product ("Pomodoro_0.1.0_amd64.deb");
      # the repository builder renames it to the Debian convention.
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: GitHub release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: deb

      # Named the way Debian names packages, because this file is what
      # someone downloads when they install without adding the repository,
      # and the pool carries the same name.
      - name: Name the package for Debian
        run: |
          for deb in deb/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            version=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)
            canonical="deb/${name}_${version}_${arch}.deb"
            [ "$deb" = "$canonical" ] || mv "$deb" "$canonical"
          done
          ls -l deb

      # Re-runnable: a release that already exists has its packages
      # replaced rather than failing the job, so a publish that failed can
      # be retried from the Actions tab.
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            deb/*.deb \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            deb/*.deb

  publish:
    name: Publish apt repository
    # Both jobs, not just the release: `needs.*` covers only direct needs,
    # and a failed package leaves the release *skipped*, which would let a
    # publish through for a tag that never produced a package. `!cancelled()`
    # rather than `always()`, which also runs on a cancelled run.
    needs: [package, release]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    # One publish at a time across the whole repository. Losing a queued one
    # is harmless here: every publish rebuilds from all releases, so the one
    # that runs is complete.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # apt-ftparchive, which builds the indexes. It is not part of the
      # runner image's declared toolset, so it is installed rather than
      # assumed.
      - name: Install apt-utils
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apt-utils

      # Every release, not just this one: apt serves whatever the indexes
      # list, so dropping the older packages would strand anyone mid-upgrade.
      - name: Collect the packages of every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p packages

          limit=1000
          # Only the tags this workflow publishes. Another release carrying a
          # .deb would otherwise be pulled into the pool, and a version
          # colliding with one already collected fails every publish from
          # then on.
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit "$limit" \
                   --json tagName,isDraft \
                   --jq '.[] | select(.isDraft | not) | .tagName
                         | select(test("^v[0-9]"))')
          [ -n "$tags" ] || { echo "::error::no published releases to build from"; exit 1; }
          # A truncated listing would quietly drop the oldest packages out of
          # the pool, which is the one thing rebuilding from every release is
          # meant to prevent.
          [ "$(printf '%s\n' "$tags" | wc -l)" -lt "$limit" ] \
            || { echo "::error::more than $limit releases; the listing is truncated"; exit 1; }

          for tag in $tags; do
            # Asked separately, because `gh release download` exits non-zero
            # for a network or API failure exactly as it does for a release
            # with nothing to download. Treating the two alike would publish
            # a repository missing whatever failed to arrive.
            debs=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                     --json assets \
                     --jq '[.assets[].name | select(endswith(".deb"))] | length')
            if [ "$debs" -eq 0 ]; then
              echo "::warning::$tag has no .deb attached; skipping"
              continue
            fi
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*.deb' --dir "packages/$tag"
          done

          # The release this run just made must be in the pool, or the
          # publish would announce a version it does not serve.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ls "packages/$GITHUB_REF_NAME"/*.deb >/dev/null 2>&1 \
              || { echo "::error::no package for $GITHUB_REF_NAME to publish"; exit 1; }
          fi

          find packages -name '*.deb' -print | sort

      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          [ -n "$APT_SIGNING_KEY" ] || {
            echo "::error::the APT_SIGNING_KEY secret is not set"
            exit 1
          }
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Build the repository
        env:
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_REPO_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          set -o pipefail
          # mapfile carries its own exit status, never the pipeline's, so the
          # count is checked rather than trusted.
          mapfile -t debs < <(find packages -name '*.deb' | sort)
          [ "${#debs[@]}" -gt 0 ] || { echo "::error::no packages to publish"; exit 1; }
          scripts/build-apt-repo.sh site "${debs[@]}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
